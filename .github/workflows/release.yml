name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Package source archive and checksum
        run: |
          git archive --format=zip --prefix="csv-key-diff-${GITHUB_REF_NAME}/" "${GITHUB_REF_NAME}" -o "csv-key-diff-${GITHUB_REF_NAME}.zip"
          sha256sum "csv-key-diff-${GITHUB_REF_NAME}.zip" > "csv-key-diff-${GITHUB_REF_NAME}.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            csv-key-diff-${{ github.ref_name }}.zip
            csv-key-diff-${{ github.ref_name }}.zip.sha256
