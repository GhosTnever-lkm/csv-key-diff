name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Verify tag matches package
        run: python -c "from csv_key_diff import __version__; assert __version__ == '${GITHUB_REF_NAME#v}'"
      - name: Package source archive and checksum
        run: |
          git archive --format=zip --prefix="csv-key-diff-${GITHUB_REF_NAME}/" "${GITHUB_REF_NAME}" -o "csv-key-diff-${GITHUB_REF_NAME}.zip"
          sha256sum "csv-key-diff-${GITHUB_REF_NAME}.zip" > "csv-key-diff-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "csv-key-diff $GITHUB_REF_NAME" --generate-notes "csv-key-diff-${GITHUB_REF_NAME}.zip" "csv-key-diff-${GITHUB_REF_NAME}.zip.sha256"
