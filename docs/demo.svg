<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">CSV Key Diff sample report preview</title><desc id="desc">A local command compares CSV snapshots and summarizes added, removed, changed, and unchanged records.</desc>
<rect width="1120" height="620" rx="22" fill="#0b1118"/><rect x="28" y="28" width="1064" height="564" rx="18" fill="#111a24" stroke="#304252"/>
<circle cx="58" cy="58" r="6" fill="#fb7185"/><circle cx="80" cy="58" r="6" fill="#fbbf24"/><circle cx="102" cy="58" r="6" fill="#34d399"/><text x="128" y="64" fill="#91a4b8" font-family="Arial,sans-serif" font-size="16">CSV KEY DIFF · LOCAL REPORT PREVIEW</text>
<text x="72" y="126" fill="#e5edf5" font-family="Arial,sans-serif" font-size="31" font-weight="700">Compare export snapshots by a stable key</text>
<rect x="72" y="154" width="976" height="54" rx="10" fill="#091017" stroke="#2d3e4d"/><text x="94" y="188" fill="#8ce7be" font-family="monospace" font-size="17">$ csv-key-diff before.csv after.csv --key mod_id</text>
<rect x="72" y="236" width="976" height="74" rx="12" fill="#17232e" stroke="#2b3c4b"/>
<text x="96" y="268" fill="#dce7f1" font-family="Arial,sans-serif" font-size="16" font-weight="700">Added: 1</text><text x="255" y="268" fill="#dce7f1" font-family="Arial,sans-serif" font-size="16" font-weight="700">Removed: 0</text><text x="430" y="268" fill="#fbbf24" font-family="Arial,sans-serif" font-size="16" font-weight="700">Changed: 1</text><text x="612" y="268" fill="#dce7f1" font-family="Arial,sans-serif" font-size="16" font-weight="700">Unchanged: 1</text>
<text x="96" y="291" fill="#8fa3b7" font-family="Arial,sans-serif" font-size="13">Input rows are matched by `mod_id`, not by their order.</text>
<rect x="72" y="334" width="976" height="46" rx="8" fill="#1a2a37"/><text x="94" y="363" fill="#9eb3c7" font-family="Arial,sans-serif" font-size="14" font-weight="700">KEY</text><text x="285" y="363" fill="#9eb3c7" font-family="Arial,sans-serif" font-size="14" font-weight="700">FIELD</text><text x="484" y="363" fill="#9eb3c7" font-family="Arial,sans-serif" font-size="14" font-weight="700">BEFORE</text><text x="754" y="363" fill="#9eb3c7" font-family="Arial,sans-serif" font-size="14" font-weight="700">AFTER</text>
<rect x="72" y="380" width="976" height="58" fill="#121d27"/><text x="94" y="415" fill="#e5edf5" font-family="monospace" font-size="15">mod-002</text><text x="285" y="415" fill="#e5edf5" font-family="monospace" font-size="15">name</text><text x="484" y="415" fill="#fda4af" font-family="Arial,sans-serif" font-size="15">Old Add-on</text><text x="754" y="415" fill="#86efac" font-family="Arial,sans-serif" font-size="15">Updated Add-on</text>
<line x1="72" y1="438" x2="1048" y2="438" stroke="#2a3947"/><rect x="72" y="439" width="976" height="58" fill="#121d27"/><text x="94" y="474" fill="#e5edf5" font-family="monospace" font-size="15">mod-003</text><text x="285" y="474" fill="#8ce7be" font-family="Arial,sans-serif" font-size="15">New row</text><text x="484" y="474" fill="#637789" font-family="Arial,sans-serif" font-size="15">—</text><text x="754" y="474" fill="#86efac" font-family="Arial,sans-serif" font-size="15">New Add-on</text>
<text x="72" y="552" fill="#8fa3b7" font-family="Arial,sans-serif" font-size="14">Files stay local · deterministic JSON/Markdown · bounded input · no value normalization</text></svg>